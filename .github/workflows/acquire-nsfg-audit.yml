name: Acquire official NSFG audit inputs
on:
  push:
    paths:
      - '.github/workflows/acquire-nsfg-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download public CDC inputs with provenance
        shell: bash
        run: |
          mkdir -p inputs
          python3 - <<'PY'
          import urllib.request, pathlib, hashlib, json, datetime
          files = {
            'NSFG-2022-2023-FemRespPUFData.zip': 'https://ftp.cdc.gov/pub/Health_Statistics/NCHS/NSFG/NSFG-2022-2023-FemRespPUFData.zip',
            'NSFG-2022-2023-codebook.pdf': 'https://www.cdc.gov/nchs/data/nsfg/codebooks/2022-2023-NSFG-FemRespPUFCodebook.pdf',
            'NSFG-2022-2023-design.pdf': 'https://www.cdc.gov/nchs/data/nsfg/varest/2022-2023-NSFG-DesignandWeightVariables.pdf',
            'CDC-Health-EStat121.pdf': 'https://www.cdc.gov/nchs/data/hestat/hestat121.pdf'
          }
          records=[]
          for name,url in files.items():
              request=urllib.request.Request(url,headers={'User-Agent':'PCOS academic reproducibility audit'})
              with urllib.request.urlopen(request,timeout=180) as response:
                  data=response.read(); status=response.status; final_url=response.url
              if name.endswith('.zip') and not data.startswith(b'PK'): raise ValueError('Not ZIP: '+name)
              if name.endswith('.pdf') and not data.startswith(b'%PDF'): raise ValueError('Not PDF: '+name)
              pathlib.Path('inputs',name).write_bytes(data)
              records.append({'filename':name,'url':url,'resolved_url':final_url,'http_status':status,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()})
          pathlib.Path('inputs/download_manifest.json').write_text(json.dumps(records,indent=2))
          print(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-nsfg-audit-inputs
          path: inputs/
          retention-days: 7
          if-no-files-found: error
